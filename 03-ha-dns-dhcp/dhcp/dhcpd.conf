# /etc/dhcp/dhcpd.conf - ISC DHCP Server (192.168.64.100)

authoritative;
default-lease-time 600;
max-lease-time 7200;

ddns-updates on;
ddns-update-style standard;

key "ddns-key" {
    algorithm hmac-sha256;
    secret "c2hhcmVkLXNlY3JldC10c2lnLWtleS1mb3ItZGRucw==";
};

zone linux.local. {
    primary 192.168.64.200;
    key "ddns-key";
}

zone 64.168.192.in-addr.arpa. {
    primary 192.168.64.200;
    key "ddns-key";
}

failover peer "dhcp-failover" {
    primary;
    address 192.168.64.100;
    port 647;
    peer address 192.168.64.101;
    peer port 647;
    max-response-delay 60;
    max-unacked-updates 10;
    mclt 3600;
    split 128;
    load balance max seconds 3;
}

subnet 192.168.64.0 netmask 255.255.255.0 {
    option routers 192.168.64.1;
    option domain-name-servers 192.168.64.200, 192.168.64.201;
    option domain-name "linux.local";

    pool {
        failover peer "dhcp-failover";
        range 192.168.64.50 192.168.64.80;
    }
}

host wstation {
    hardware ethernet 72:62:96:38:43:23;
    fixed-address 192.168.64.90;
    ddns-hostname "wstation";
}
