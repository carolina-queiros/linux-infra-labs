# /etc/snmp/snmpd.conf - Configuracao SNMPv3 + Alertas

agentAddress udp:127.0.0.1:161

# --- Configuracao SNMPv3 ---
engineID 0x8000000001020304
createUser sysadmin SHA PassAuth123 AES PassPriv456
rouser sysadmin priv .1

extend monitor /usr/local/bin/monitor.py

# --- Configuracao de Alertas (Ponto C) ---
informsink localhost public

# 1. Monitorizar CPU (Trap se User CPU > 80%)
monitor -r 10 "Alerta_CPU_Alto" .1.3.6.1.4.1.2021.11.9.0 > 80

# 2. Monitorizar Disco (Inform se < 1GB livre)
disk / 1000000
monitor -r 10 "Alerta_Disco_Cheio" dskErrorFlag != 0
